name: Tests

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test binary
        run: g++ -std=c++17 -O2 -Wall -Wextra main_test.cpp -o main_test

      - name: Run unit tests
        run: ./main_test
